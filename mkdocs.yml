site_name: Celeste's Girl
site_url: https://art.tightbytes.com
edit_uri: "http://127.0.0.1:8000/docs/"
use_directory_urls: true

validation:
  links:
    absolute_links: ignore

not_in_nav: |
  /includes/image-references.md
  /includes/W_DiscussT.md

theme:
  name: material
  icon: assets/images/iconL.png
  logo: assets/images/logoL.png
  palette:
    # Light mode
    - scheme: default
      primary: pink
      accent: red
      toggle:
        icon: material/weather-night # indigo
        name: Switch to Dark Mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: white
      toggle:
        icon: material/weather-sunny # indigo
        name: Switch to Light Mode

  features:
    # - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy

extra_css:
  - stylesheets/custom.css
  - stylesheets/extras.css

nav:
  - Home: index.md

  - Writing:
      - writing/index.md
      - 💞 Celeste's Girl (Orig): writing/1CG-2ndEd.md
      - 💞 Unhidden (CG-Rev): writing/1Unhidden.md
      - 📚 The Deep End.v1: writing/2DE-1stEd.md
      - 🥰 Write Emotions: writing/B-Emotions.md
      - Writing Metaphors: writing/C-Metaphors.md
      - 🏔 Chronology 🏔: writing/D-Chronology.md
      - 🌿 Settings Layout: writing/F-SettingPlan.md
      - 👄 Write-DiscussE: writing/W_DiscussE.md
      - 👭 Emily-DiscussEa: writing/W_DiscussEa.md
      - 🌿 Write-DiscussF: writing/W_DiscussF.md
      - 💎 Write-DiscussFa: writing/W_DiscussFa.md
      - 🌿 Write-DiscussFb: writing/W_DiscussFb.md
      - 🩸 Write-DiscussG: writing/W_DiscussG.md
      - 🥼 Write-DiscussGa: writing/W_DiscussGa.md
      - ☕ Write  💞  Edit: writing/W_Edits.md

  - Discussion:
      - discuss/index.md
      - 📚 Celeste's Girl.v1: discuss/1CG-1stEd.md
      - 📚 Celeste's Girl.v3: discuss/1CG-3rdEd.md
      - Design Structures: discuss/A-Structure.md
      - Canon-CelestesGrl: discuss/E-StoryCanon.md
      - 💞 Writing Friday: discuss/W_Writing.md
      - 📒 The Ledger-Ch9: discuss/W_Ledger.md
      - 🍒 Cherry Picking: discuss/Sodom.md
      - 🌿 Write-Discuss1: discuss/W_DiscussA.md
      - 🌿 Write-Discuss2: discuss/W_DiscussB.md
      - 🌿 Write-Discuss3: discuss/W_DiscussC.md
      - 🌿 Write-Discuss4: discuss/W_DiscussD.md

  - Media:
      - media/index.md
      - Music: media/Music.md
      - Video: media/Videos.md

  - Work:
      - work/index.md
      - Emily's Intelligence: work/01Emilyai.md
      - 💋 Images in ComfyUI: work/02Comfyui.md
      - ArtInt Illustrations: work/03CUIllus.md
      - Making LoRAs FluxGym: work/04FluxGym.md
      - Domains Transferring: work/05DomXfer.md
      - Banners-Website Misc: work/06Banners.md
      - 💛 💜 Video Scripts: work/08VScripts.md
      - Ideas to Study: work/09ToStudy.md
      - Video in ComfyUI: work/10VideoCUI.md
      - ✂ Temporary Reads ✂: work/temptext.md

plugins:
  - search
  - tags
markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - admonition
  - footnotes
  - def_list
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.blocks.caption
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs
